services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vinamilk-hrm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Vinamilk@2026Strong!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - vnm_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: vinamilk-hrm-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - vnm_seq_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinamilk-hrm-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=VinamilkHRM;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Vinamilk@2026Strong!};TrustServerCertificate=True;"
      Security__PiiEncryptionKey: "${VNM_PII_KEY:-Change_This_32Byte_AES256_Key_In_Prod!}"
      Observability__SeqServerUrl: "http://seq:80"
    ports:
      - "8080:8080"
    volumes:
      - vnm_logs:/app/logs
      - vnm_backups:/app/backups

volumes:
  vnm_sql_data:
  vnm_seq_data:
  vnm_logs:
  vnm_backups:

